name: Build resume PDFs

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: resume-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Typst
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat .typst-version)"
          archive="$RUNNER_TEMP/typst.tar.xz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/typst/typst/releases/download/v${version}/typst-x86_64-unknown-linux-musl.tar.xz" \
            --output "$archive"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install validation dependencies
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Build both PDFs
        run: python3 scripts/build.py
      - name: Validate PDFs and render previews
        run: python3 scripts/check.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resume-pdfs
          path: dist/*.pdf
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resume-review
          path: |
            dist/*.png
            dist/*.txt
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated PDFs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resume-pdfs
          path: dist
      - name: Update latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$COMMIT_SHA" -F force=true
            gh release edit latest --title "Latest resume PDFs" --prerelease \
              --notes "Built and validated from commit $COMMIT_SHA."
          else
            gh release create latest --target "$COMMIT_SHA" --title "Latest resume PDFs" \
              --prerelease --notes "Built and validated from commit $COMMIT_SHA."
          fi
          gh release upload latest dist/*.pdf --clobber
